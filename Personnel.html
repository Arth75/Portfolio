<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
 body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    background: #f2e8df;
    color: Black;
}

header {
    text-align: center;
    padding: 30px;
    background: #f2e8df;
    color: DarkTurquoise;
}

header h1 {
    margin: 0;
    font-size: 2.2em;
}

.bloc {
    background: white;
    margin: 30px auto;
    padding: 25px;
    max-width: 900px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.bloc h2 {
    color: Black;
    margin-bottom: 15px;
}

ul {
    padding-left: 20px;
}

.competences li {
    margin: 8px 0;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
}

th {
    background: #2b4c7e;
    color: white;
}

tr:nth-child(even) {
    background: #f2e8df;
}

footer {
    text-align: center;
    padding: 20px;
    background: #f2e8df;
    color: DarkTurquoise;
    margin-top: 40px;
} 
</style>
<header>
    <h1>Projets – Épreuve E5/Personnels</h1>
    <p>Document de synthèse – Portfolio et compétences évaluées</p>
</header>
